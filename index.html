<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>zyf 的前端网页作品集</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="hero">
            <span class="hero-mark" aria-hidden="true"></span>
            <p class="eyebrow">前端 · 作品集</p>
            <h1>zyf 的前端网页作品集</h1>
            <p class="hero-description">一些关于表单、知识问答与美食探索的网页练习。<br class="desktop-break">选择一个作品，打开看看。</p>
        </header>

        <section class="projects" aria-label="网页作品">
            <a class="project-card" href="https://web1-khoraaa.vercel.app/" target="_blank" rel="noopener noreferrer">
                <div class="project-preview">
                    <img src="./img/register.png" alt="Register Form 网页预览">
                    <span class="project-arrow" aria-hidden="true"><i></i></span>
                </div>
                <div class="project-info">
                    <div class="project-heading">
                        <h2>Register Form</h2>
                        <span class="project-number">01</span>
                    </div>
                    <p class="project-category">Register</p>
                    <p class="project-description">简洁直观的注册表单页面</p>
                </div>
            </a>

            <a class="project-card" href="https://web2-ks.vercel.app/" target="_blank" rel="noopener noreferrer">
                <div class="project-preview">
                    <img src="./img/quiz-time.png" alt="Quiz Time 网页预览">
                    <span class="project-arrow" aria-hidden="true"><i></i></span>
                </div>
                <div class="project-info">
                    <div class="project-heading">
                        <h2>Quiz Time</h2>
                        <span class="project-number">02</span>
                    </div>
                    <p class="project-category">Quiz</p>
                    <p class="project-description">轻松有趣的知识问答体验</p>
                </div>
            </a>

            <a class="project-card" href="https://web2-hw.vercel.app/" target="_blank" rel="noopener noreferrer">
                <div class="project-preview">
                    <img src="./img/recipe.png" alt="Recipe Finder 网页预览">
                    <span class="project-arrow" aria-hidden="true"><i></i></span>
                </div>
                <div class="project-info">
                    <div class="project-heading">
                        <h2>Recipe Finder</h2>
                        <span class="project-number">03</span>
                    </div>
                    <p class="project-category">Recipe</p>
                    <p class="project-description">发现灵感食谱，探索美味料理</p>
                </div>
            </a>
        </section>

        <footer class="footer">
            <span class="footer-dot" aria-hidden="true"></span>
            <p>用代码记录每一次创作</p>
        </footer>
    </main>
</body>
</html>
